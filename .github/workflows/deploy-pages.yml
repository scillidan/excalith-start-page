name: Deploy to GitHub Pages

on:
  push:
    branches: [scillidan]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scillidan

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute base path
        id: paths
        run: |
          NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$NAME" == *.github.io ]]; then
            echo "base_path=" >> $GITHUB_OUTPUT
          else
            echo "base_path=/$NAME" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile

      - name: Copy assets to public
        run: |
          mkdir -p public/assets
          cp -r data/assets/. public/assets/ 2>/dev/null || true

      - name: Build static export
        env:
          EXPORT_MODE: "true"
          GH_BASE_PATH: ${{ steps.paths.outputs.base_path }}
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.base_path }}
        run: yarn build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
