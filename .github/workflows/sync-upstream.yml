name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Compute base path
        id: paths
        run: |
          NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$NAME" == *.github.io ]]; then
            echo "base_path=" >> $GITHUB_OUTPUT
          else
            echo "base_path=/$NAME" >> $GITHUB_OUTPUT
          fi

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/excalith/excalith-start-page
          git fetch upstream

      - name: Sync main with upstream
        run: |
          git checkout main
          git rebase upstream/main
          git push origin main

      - name: Merge main into scillidan (preserve settings)
        run: |
          git checkout scillidan
          SETTINGS=$(cat data/settings.json)
          git merge main --no-commit --no-ff || true
          echo "$SETTINGS" > data/settings.json
          git add data/settings.json
          git commit -m "chore: sync with upstream [skip ci]" || echo "Already up to date"
          git push origin scillidan

      - name: Copy assets to public
        run: |
          mkdir -p public/assets
          cp -r data/assets/. public/assets/ 2>/dev/null || true

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile

      - name: Build static export
        env:
          EXPORT_MODE: "true"
          GH_BASE_PATH: ${{ steps.paths.outputs.base_path }}
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.base_path }}
        run: yarn build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
